<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CINEFIL License</title>
</head>
<body style="margin:0; padding:20px; background-color:#ffffff; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#1a202c; line-height: 1.6;">
  <div style="max-width: 600px; margin: 0 auto;">

    <div style="font-size: 16px; margin-bottom: 32px; white-space: pre-wrap;">
      {% if custom_message %}
        {{ custom_message|linebreaks }}
      {% else %}
        <!-- <p>Dear {{ name }},</p> -->
        <p>Please find your license document attached below.</p>
      {% endif %}
    </div>

    <div style="padding-top: 20px; border-top: 1px solid #edf2f7; font-size: 14px; color: #718096;">
      <p style="margin: 0;">
        <strong>Attachment:</strong> CINEFIL_{{ ref_no }}.pdf
      </p>
      <p style="margin: 4px 0 0;">
        Best regards,<br>
        <strong>CINEFIL Team</strong>
      </p>
    </div>

  </div>
</body>
</html>
